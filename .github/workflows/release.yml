name: Release

on:
  # Manual only. The fork revision counts releases, not pushes — an auto-release
  # on every push to main would burn a revision on a README typo. Merge upstream
  # and land fork commits freely, then trigger this when you want a release.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history AND tags: tools/fork_release.py reads the fork revision
          # off the existing v<base>.<n> tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Not python-semantic-release. It derives a strict three-segment SemVer
      # from Conventional Commits and cannot express <upstream>.<fork revision>,
      # so it produced numbers that collide with upstream's own releases.
      - name: Compute fork version
        id: version
        run: |
          version="$(python tools/fork_release.py --print-next)"
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump manifest and tag
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          python tools/fork_release.py --apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifest already at $version, nothing to commit."
          else
            git commit -am "chore(release): $version"
            git push
          fi
          git tag "v$version"
          git push origin "v$version"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            --title "v$version" \
            --generate-notes
