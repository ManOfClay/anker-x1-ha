# This project is a Home Assistant custom integration, not a distributed Python
# package. The only purpose of this file is to record which upstream release
# this fork sits on (see below) — the release job reads it from here.

[tool.anker_x1_fork]
# The upstream release currently merged into this fork. Bump this by hand as
# part of each `git merge upstream/main`, then the release job derives the
# published version as `<upstream_version>.<fork revision>` — see
# tools/fork_release.py for why that shape and not `+fork.N`.
upstream_version = "0.5.2"

# Python Semantic Release used to own the version here. It cannot express a
# four-segment version: it derives a strict three-segment SemVer from
# Conventional Commits, so it would keep producing numbers that collide with
# upstream's own releases — v0.5.2 already means two unrelated trees because of
# that. tools/fork_release.py replaces it; commit messages stay Conventional
# Commits for the changelog, they just no longer decide the version.
